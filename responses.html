
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responses</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
    }
    main { max-width: 1050px; margin: auto; padding: 32px 20px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; }
    p { color: #94a3b8; }
    button, input {
      padding: 12px 15px;
      border-radius: 9px;
      font: inherit;
    }
    button {
      background: #2563eb;
      color: white;
      border: 0;
      cursor: pointer;
    }
    input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #475569;
      color: white;
      margin: 20px 0;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .date { font-size: 13px; color: #94a3b8; }
    .message { margin-top: 10px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Responses</h1>
        <p id="status">Loading responses...</p>
      </div>
      <button onclick="loadResponses()">Refresh</button>
    </header>

    <input id="search" placeholder="Search responses...">
    <div id="results"></div>
  </main>

  <script>
    const API = 'https://api.geagroupau.com/responses.php';
    let responses = [];

    async function loadResponses() {
      const status = document.getElementById('status');
      status.textContent = 'Loading...';

      try {
        const response = await fetch(API, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);

        const data = await response.json();
        responses = data.responses || [];
        render();

        status.textContent = responses.length + ' responses';
      } catch (error) {
        status.textContent = 'Could not load responses: ' + error.message;
      }
    }

    function render() {
      const search = document.getElementById('search').value.toLowerCase();
      const results = document.getElementById('results');
      results.replaceChildren();

      const filtered = responses.filter(item =>
        (item.message || '').toLowerCase().includes(search) ||
        (item.date || '').toLowerCase().includes(search)
      );

      if (!filtered.length) {
        results.textContent = 'No responses found.';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        const date = document.createElement('div');
        date.className = 'date';
        date.textContent = item.date || 'Unknown date';

        const message = document.createElement('div');
        message.className = 'message';
        message.textContent = item.message || '(No message)';

        card.append(date, message);
        results.appendChild(card);
      });
    }

    document.getElementById('search').addEventListener('input', render);
    loadResponses();
  </script>
</body>
</html>
